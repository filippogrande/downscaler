services:
  emergency-stop:
    build: .
    image: filippogrande/downscaler:latest
    container_name: emergency-stop
    # 'no': e' un job one-shot, lo lancia systemd con 'docker start'.
    restart: "no"
    # Ha bisogno del daemon Docker per spegnere/riaccendere gli altri servizi.
    # rw (non ro): 'docker compose down' scrive sul socket, ro non basta.
    # E' un accesso equivalente a root, voluto e documentato.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./config.yaml:/app/config.yaml:ro
      - ./services:/app/services:ro
      - state:/app/state
      - /var/log/emergency-stop.log:/app/emergency-stop.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  state:
