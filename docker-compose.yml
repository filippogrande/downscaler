services:
  emergency-stop:
    # SOLO pull da Docker Hub: l'immagine la builda GitHub Actions a ogni merge
    # su main (workflow 'Docker Build & Push'). Nessun build locale.
    image: filippogrande/downscaler:latest
    container_name: emergency-stop
    # Gira ininterrotto (loop dentro entrypoint.sh).
    # DRY_RUN=true di default: non spegne/riaccende NIENTE, stampa solo cosa farebbe.
    restart: unless-stopped
    # Valori letterali, niente interpolazione ${...}, nessun .env.
    # Per farlo lavorare davvero: DRY_RUN: "false" qui, poi docker compose up -d.
    environment:
      DRY_RUN: "true"
    volumes:
      # rw (non ro): 'docker compose down' scrive sul socket, ro non basta.
      # E' un accesso equivalente a root al daemon: voluto e documentato.
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./config.yaml:/app/config.yaml:ro
      - ./services:/app/services:ro
      # I compose_dir nei file servizio sono path assoluti dell'HOST
      # (/mnt/applicazioni/yml/docker/...): senza questo mount il container
      # non li vede e TUTTI i servizi risultano inesistenti.
      #
      # rw (non ro): incidents.dir in config.yaml e' sotto questo mount e lo
      # snapshot d'incidente scrive li'. Con :ro il mkdir sollevava OSError
      # (EROFS) dentro _close_incident e il container partiva in restart loop
      # (24/10/26). Il mount generico resta rw apposta.
      - /mnt/applicazioni:/mnt/applicazioni:rw
      - state:/app/state
      # Nomi host e container DIVERSI: un bind di un file che non esiste sull'host
      # crea una DIRECTORY dentro il container, e il log handler non la apre.
      - /var/log/emergency-stop.log:/app/logs/emergency-stop.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  state:
