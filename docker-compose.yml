services:
  emergency-stop:
    build: .
    image: filippogrande/downscaler:latest
    container_name: emergency-stop
    # Job one-shot. restart: 'no' perche' e' systemd a lanciarlo ogni 60s;
    # NON usare always/unless-stopped: il container deve uscire a ogni giro,
    # altrimenti il timer lo trova gia' in esecuzione e il lavoro non si fa.
    restart: "no"
    environment:
      # DRY_RUN=true → mostra cosa farebbe SENZA spegnere nulla.
      # Primo avvio: lascialo a true, poi passalo a false quando e' verificato.
      DRY_RUN: "${DRY_RUN:-true}"
    volumes:
      # rw (non ro): 'docker compose down' scrive sul socket, ro non basta.
      # E' un accesso equivalente a root al daemon: voluto e documentato.
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./config.yaml:/app/config.yaml:ro
      - ./services:/app/services:ro
      - state:/app/state
      - /var/log/emergency-stop.log:/app/emergency-stop.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  state:
