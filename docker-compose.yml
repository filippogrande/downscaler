services:
  emergency-stop:
    build: .
    image: filippogrande/downscaler:latest
    container_name: emergency-stop
    # Job one-shot: lo lancia systemd con 'docker start -a' ogni 60s.
    restart: "no"
    environment:
      # DRY_RUN=true → mostra cosa farebbe SENZA spegnere nulla.
      # Primo avvio: lascialo a true, poi passalo a false quando e' verificato.
      DRY_RUN: "${DRY_RUN:-true}"
      GLANCES_URL: "${GLANCES_URL:-http://10.0.0.5:61208}"
      TELEGRAM_ENABLED: "${TELEGRAM_ENABLED:-false}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    volumes:
      # rw (non ro): 'docker compose down' scrive sul socket, ro non basta.
      # E' un accesso equivalente a root al daemon: voluto e documentato.
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./config.yaml:/app/config.yaml:ro
      - ./services:/app/services:ro
      - state:/app/state
      - /var/log/emergency-stop.log:/app/emergency-stop.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  state:
