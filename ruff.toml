# Ruff config per Emergency Stop
#
# Sintassi [lint]: ruff depreca le opzioni top-level (extend-select,
# ignore, per-file-ignores) in favore della sezione [lint].
#
# Le eccezioni per file stanno in per-file-ignores, non in ignore globale:
# un ignore globale toglierebbe la regola anche ai test, dove invece serve.
#
# Ogni codice elencato qui e' stato letto nell'output di ruff: un selettore
# inesistente (es. DAR, SUB) fa fallire ruff con exit 2, quindi non si
# aggiunge un codice 'per sicurezza'.
#
# emergency-stop.py e' codice preesistente: le regole attive si limitano a
# cio' che questa PR ha introdotto. I preesistenti restano spenti finche'
# non si sistemano, elencati in fondo a questa sezione.

target-version = "py312"

[lint]
extend-select = ["ALL"]

ignore = [
    # E501: righe lunghe (messaggi di log e note, non blocca la review)
    "E501",
    # I: import non ordinati (non blocca la review)
    "I",
    # UP: suggerimenti di modernizzazione (typing moderno, pathlib, ...)
    "UP",
    # COM812: virgola finale mancante (gestione a carico del formatter)
    "COM812",
    # D203/D211 e D212/D213 sono coppie incompatibili: se ne tiene una
    # sola per coppia, altrimenti ruff stampa un warning e ne ignora una.
    "D203",
    "D212",
    # T20: print nel codice (il tool usa stdout per i messaggi utente)
    "T20",
]

[lint.per-file-ignores]
# emergency-stop.py — codice preesistente, non sistemato da questa PR.
# EXE001 non e' risolvibile: i permessi del file non sono impostabili
# via GitHub MCP.
"emergency-stop.py" = [
    "EXE001",
    # Typing moderno / compatibilita' con Python piu' vecchi
    "FA",
    "UP006",
    "UP007",
    # Logging: il codice passa le variabili come argomenti per design
    "G",
    "LOG",
    # subprocess con lista (nessun shell=True) e check=False voluto
    "S603",
    "S607",
    "PLW1510",
    # Eccezioni ampie: il codice le cattura per degradare con un log
    "BLE001",
    "TRY",
    "EM",
    "FBT",
    # f-string senza placeholder
    "F541",
    # Docstring non standard (D213 e' in conflitto con D212 globale)
    "D",
    # Complessita' delle funzioni preesistenti
    "C901",
    "PLR0912",
    "PLR0915",
    # Annotazioni di ritorno su funzioni che non ritornano nulla
    "ANN201",
    "ANN202",
    # datetime.now() senza tz: il codice usa l'ora locale di sistema
    "DTZ005",
    # else+if annidato: refactor non necessario per questa PR
    "PLR5501",
    # global statement: DRY_RUN e' letto da piu' punti del modulo
    "PLW0603",
    # concatenazione di liste (stile preesistente)
    "RUF005",
    # nota di copyright: il repo non la usa
    "CPY001",
]

# tests/ — i test usano assert (e' il loro scopo), fixture di pytest,
# nomi volutamente semplici e funzioni senza return type.
"tests/*" = [
    "S101",
    "ANN",
    "ANN201",
    "ANN202",
    "ANN204",
    "ARG",
    "D",
    "PT",
    "PLC",
    "PLR",
    "PTH",
    "SLF",
    "INP",
    "CPY001",
]
