# Ruff config per Emergency Stop
#
# Regole attive per tutto il repo (extend-select + default di ruff).
# Le eccezioni stanno in per-file-ignores, non in ignore globale:
# un ignore globale per codice (DTZ, TRY, EM, D...) toglierebbe la
# regola anche ai test, dove invece serve.
extend-select = ["ALL"]

ignore = [
    # E501: righe lunghe (il codice ha testi e messaggi lunghi, non blocca)
    "E501",
    # I: import non ordinati (non blocca la review)
    "I",
    # PLW: warning di design (es. PLW0603 global statement) — non blocca
    "PLW",
    # UP: suggerimenti di modernizzazione (typing moderno, ecc.)
    "UP",
]

target-version = "py312"

[per-file-ignores]
# emergency-stop.py: codice preesistente, non sistemato da questa PR.
# EXE001 non e' risolvibile: i permessi del file non sono impostabili
# via GitHub MCP.
"emergency-stop.py" = [
    "EXE001", "DTZ", "ANN", "TRY", "PTH", "EM", "G", "S", "BLE", "TID",
    "D", "FBT", "RUF", "PERF", "SIM", "RET", "ARG", "PT", "T20", "COM",
    "Q", "ICN", "N", "A", "C4", "PD", "NPY", "AIR", "DJ", "INT", "PGH",
    "PLC", "PLE", "PLR", "CPY", "DAR", "DOC", "ERA", "FA", "FIX", "FLY",
    "FURB", "LOG", "PIE", "SLF", "SLOT", "TCH", "TD", "YTT", "ASYNC",
    "B9", "C90", "T10", "INP", "ISC", "TC", "RSE", "TH", "PYI",
]
# tests/: i test usano fixture di pytest e nomi volutamente semplici.
"tests/*" = ["ANN", "ARG", "D", "PT", "PLC", "PLR", "PTH", "SLF", "INP"]
