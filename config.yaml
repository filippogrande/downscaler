    compose_file: "docker-compose.yml"
  radarr:
    compose_dir: "/mnt/applicazioni/yml/docker/radarr"
    compose_file: "docker-compose.yml"
  recyclarr:
    compose_dir: "/mnt/applicazioni/yml/docker/recyclarr"
    compose_file: "docker-compose.yml"
  stash:
    compose_dir: "/mnt/applicazioni/yml/docker/stash"
    compose_file: "docker-compose.yml"
  gramps:
