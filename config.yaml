# Emergency Stop — configurazione (copia in /etc/emergency-stop/config.yaml)
#
# Qui stanno SOLO le soglie e i collegamenti esterni.
# L'elenco dei servizi e' in /etc/emergency-stop/services/<nome>.yaml
# (un file per servizio: aggiungerne uno non tocca questo file).

glances:
  url: "http://10.0.0.5:61208"

monitor:
  metric: "iowait"              # "iowait" o "load"
  sample_interval_sec: 30       # campiona ogni 30s
  window_sec: 120               # finestra media mobile: 2 min
  stop_threshold: 80.0          # media > 80% → ferma un servizio
  restart_threshold: 60.0       # media < 60% → puo' riavviare
  check_interval_sec: 60        # esegui il loop ogni 60s

recovery:
  calm_duration_sec: 300        # 5 min di calma prima del primo riavvio
  restart_delay_sec: 300        # 5 min tra un riavvio e l'altro

telegram:
  enabled: true
  bot_token: "INSERISCI_BOT_TOKEN"
  chat_id: "INSERISCI_CHAT_ID"
