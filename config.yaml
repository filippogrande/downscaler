# Emergency Stop — configurazione
#
# File montato nel container a /app/config.yaml (vedi docker-compose.yml).
# Soglie, metrica e recovery stanno QUI. I servizi stanno in services/<nome>.yaml.
# L'intervallo del loop e' check_interval_sec sotto: un'unica fonte, non duplicata.

glances:
  url: "http://10.0.0.5:61208"

monitor:
  metric: "iowait"               # "iowait" o "load" (compatibilita', log)
  sample_interval_sec: 30        # campiona ogni 30s
  window_sec: 120                # finestra media mobile: 2 min
  stop_threshold: 80.0           # iowait > 80% -> ferma un servizio
  restart_threshold: 60.0        # iowait < 60% -> puo' riavviare
  load_stop_threshold: 6.0       # load > 6 (su 6 core) -> ferma un servizio
  load_restart_threshold: 4.0    # load < 4 -> puo' riavviare
  # Soglie critiche: oltre questi valori il downscale ferma DUE servizi.
  load_super_threshold: 11.0     # load > 11 -> super-stop (2 servizi)
  iowait_super_threshold: 95.0   # iowait > 95% -> super-stop (2 servizi)
  check_interval_sec: 60         # loop ogni 60s (letto da entrypoint.sh)

recovery:
  calm_duration_sec: 300         # 5 min di calma prima del primo riavvio
  restart_delay_sec: 300         # 5 min tra un riavvio e l'altro

telegram:
  enabled: false                 # true = notifiche attive
  bot_token: "INSERISCI_BOT_TOKEN"
  chat_id: "INSERISCI_CHAT_ID"

incidents:
  enabled: true                 # raccogli log e metriche durante l'incidente
  dir: "/mnt/applicazioni/yml/docker/emergency-stop/incidents"
  telegram_report: true         # invia report Telegram alla fine dell'incidente
  log_tail: 20000               # max righe di log per container
  log_window_min: 15            # finestra log prima/dopo l'incidente (minuti)
