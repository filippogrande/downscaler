recovery:
  calm_duration_sec: 300       # 5 min di calma (media < 60%) prima di riavviare
  restart_delay_sec: 300        # 5 min tra un riavvio e il successivo
  restart_check_sec: 30         # controlla ogni 30s se la calma è mantenuta

telegram:
  enabled: true
  bot_token: "INSERISCI_BOT_TOKEN"
  chat_id: "INSERISCI_CHAT_ID"
