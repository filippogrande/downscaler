# Emergency Stop Configuration
# Modifica su GitHub → git pull sul server → sudo systemctl restart emergency-stop.timer

glances:
  url: "http://10.0.0.5:61208"

monitor:
  metric: "iowait"        # "iowait" o "load"
  threshold: 80.0         # soglia (% per iowait, valore per load1)
  duration_sec: 120       # deve restare sopra per 2 minuti prima di agire
  check_interval_sec: 60  # ogni quanto controlla

# Servizi che possono essere fermati, in ordine di priorità
# Primo = più conveniente fermare (facile → medio → difficile)
stop_order:
  # ── Facili (batch/differibili, nessun impatto utente) ──
  - jellyseer
  - lidarr
  - sonarr
  - sonarr-anime
  - prowlarr
  - radarr
  - recyclarr
  - stash
  - gramps
  - warracker
  - cleanuparr
  - airtrail
  - trip
  # ── Medi (servizi attivi ma non critici) ──
  - qbittorrent
  - suwayomi
  - suwayomi-nsfw
  - interesting-items
  - romm
  # ── Difficili (servizi che vuoi tenere su il più possibile) ──
  - langfuse
  - jellyfin
  # MAI fermare: nextcloud, vikunja, immich, hermes, glances, uptime-kuma, ecc.

services:
  jellyseer:
    compose_dir: "/mnt/applicazioni/yml/docker/jellyseer"
    compose_file: "docker-compose.yml"
  lidarr:
    compose_dir: "/mnt/applicazioni/yml/docker/lidarr"
    compose_file: "docker-compose.yml"
  sonarr:
    compose_dir: "/mnt/applicazioni/yml/docker/sonarr"
    compose_file: "docker-compose.yml"
  sonarr-anime:
    compose_dir: "/mnt/applicazioni/yml/docker/sonarr-anime"
    compose_file: "docker-compose.yml"
  prowlarr:
