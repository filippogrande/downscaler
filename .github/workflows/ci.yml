name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest bandit

      # Diagnostica: elenca i prefissi di regola ruff disponibili. Se un
      # ruff.toml ha un selettore inesistente, la CI fallisce con un errore
      # criptico (exit 2) e non si capisce quale codice e' sbagliato.
      - name: ruff rule prefixes
        run: ruff rule --all | grep -oE '^[A-Z]+[0-9]+' | sed 's/[0-9]*$//' | sort -u

      - name: Lint
        run: ruff check emergency-stop.py tests/

      - name: Security scan
        # bandit segnala warning su subprocess/requests: li accettiamo,
        # ma un finding medio+ blocca. -ll = solo medium e high.
        run: bandit -r emergency-stop.py -ll

      - name: Test
        run: pytest --tb=short -q

      - name: Docker build
        run: docker build -t downscaler .

      # Il build da solo non basta: il Dockerfile puo' copiare i moduli nel
      # posto sbagliato (es. `COPY downscaler/ ./` li appiattisce in /app)
      # e l'immagine si builda comunque. Verifica che il package sia
      # importabile DENTRO l'immagine — e' il modo piu' diretto per beccare
      # questo bug prima che arrivi al container.
      - name: Docker image imports downscaler
        run: docker run --rm --entrypoint python3 downscaler -c "import downscaler, downscaler.config, downscaler.monitoring, downscaler.services, downscaler.state, downscaler.docker_ops, downscaler.incidents"
