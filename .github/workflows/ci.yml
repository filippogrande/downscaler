name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest bandit

      # Diagnostica: elenca i prefissi di regola ruff disponibili. Se un
      # ruff.toml ha un selettore inesistente, la CI fallisce con un errore
      # criptico (exit 2) e non si capisce quale codice e' sbagliato.
      - name: ruff rule prefixes
        run: ruff rule --all | grep -oE '^[A-Z]+[0-9]+' | sed 's/[0-9]*$//' | sort -u

      - name: Lint
        run: ruff check emergency-stop.py tests/

      - name: Security scan
        # bandit segnala warning su subprocess/requests: li accettiamo,
        # ma un finding medio+ blocca. -ll = solo medium e high.
        run: bandit -r emergency-stop.py -ll

      - name: Test
        run: |
          set -o pipefail
          timeout 120 pytest --tb=short -q -v 2>&1 | tee pytest-ci.log
          exit $?

      # DIAGNOSTICA TEMPORANEA: scrive le ultime righe del log in un file.
      - name: Diagnostica test
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('pytest-ci.log') ? fs.readFileSync('pytest-ci.log', 'utf8') : '(log assente)';
            const ultime = log.split('\n').slice(-15).join('\n');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'diag-pytest.log',
              message: 'diag: log pytest',
              content: Buffer.from(ultime).toString('base64'),
              branch: context.payload.pull_request.head.ref,
            });

      - name: Docker build
        run: docker build -t downscaler .
