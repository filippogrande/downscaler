name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest bandit

      - name: Lint
        run: ruff check emergency-stop.py tests/

      - name: Security scan
        # bandit segnala warning su subprocess/requests: li accettiamo,
        # ma un finding medio+ blocca. -ll = solo medium e high.
        run: bandit -r emergency-stop.py -ll

      - name: Test
        run: pytest --tb=short -q

      - name: Docker build
        run: docker build -t downscaler .
